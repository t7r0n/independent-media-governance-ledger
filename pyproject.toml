[project]
name = "independent-media-governance-ledger"
version = "0.1.0"
description = "A governance ledger for media portfolios that tracks editorial policy versions, ownership/brand relationships, infrastructure dependencies, "
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tarun Aditya Kusupati" }
]
dependencies = []

[project.scripts]
independent-media-governance-ledger = "independent_media_governance_ledger.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
